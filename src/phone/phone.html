<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/icon.png">
<title>After Service</title>
<style>
:root{--bg:#0b0a09;--p:#151210;--p2:#1f1a15;--line:#2e2620;--tx:#f6efe8;--mut:#a09486;--o:#ff8a1f;--o2:#ffb35c;--ok:#7fdc8f;--bad:#ff8c6e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px)}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1b1410 70%,#1b141000);padding:14px 18px 10px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:11px;background:radial-gradient(circle at 30% 30%,#ffb35c,#ff8a1f 55%,#c9560a);box-shadow:0 0 18px #ff8a1f66;display:grid;place-items:center}
.brand b{display:block;font-size:17px}.brand small{color:var(--o2);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 8px var(--ok);vertical-align:1px}
.seg{display:flex;margin-top:14px;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:11px 6px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,#3d250f,#2a1b0d);color:var(--o2);box-shadow:inset 0 0 0 1px #ff8a1f55}
.seg em{font-style:normal;background:var(--o);color:#1c0d00;border-radius:9px;padding:1px 7px;font-size:12px;margin-left:5px}
main{padding:6px 18px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
label.lbl{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input[type=text]{width:100%;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);outline:none}
input[type=text]:focus{border-color:var(--o)}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:150px;border-radius:18px;margin-top:12px;border:1.5px dashed #ff8a1f88;background:radial-gradient(circle at 50% 0,#3a230f,#17110c 70%);text-align:center}
.pick b{font-size:18px}.pick span{color:var(--mut);font-size:13px}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pick svg{color:var(--o2)}
.sum{display:flex;align-items:center;gap:10px;margin:16px 2px 6px}
.sum b{font-size:15px}.sum span{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:5px;background:#000;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a1f,#ffb35c);transition:width .25s}
.q{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qi{display:flex;align-items:center;gap:11px;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:8px}
.qi .th{width:48px;height:48px;border-radius:9px;background:#241b13 center/cover;flex:none;display:grid;place-items:center;color:var(--o2);font-size:11px;font-weight:700}
.qi .tx{flex:1;min-width:0}.qi .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.qi .tx small{color:var(--mut);font-size:12px}.qi .tx small.ok{color:var(--ok)}.qi .tx small.bad{color:var(--bad)}
.qi .bar{margin-top:6px;height:5px}
.qi .rt{border:1px solid var(--line);background:var(--p2);border-radius:9px;padding:6px 10px;font-size:13px}
.tip{color:var(--mut);font-size:13px;line-height:1.5;margin:14px 4px 0}
.tip b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.gi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#1d1611 center/cover;border:0;padding:0}
.gi .v{position:absolute;left:6px;bottom:6px;background:#000a;border-radius:6px;padding:2px 6px;font-size:11px;color:#fff;display:flex;gap:4px;align-items:center}
.gi .fn{position:absolute;inset:auto 0 0 0;padding:4px 6px;font-size:10px;background:linear-gradient(0deg,#000c,#0000);color:#fff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--mut);padding:40px 20px}.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.big{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;background:linear-gradient(135deg,#ffb35c,#ff8a1f 55%,#e8650a);color:#1c0d00;box-shadow:0 8px 24px #ff8a1f44;text-decoration:none}
.big.ghost{background:var(--p2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.row2{display:flex;gap:8px;margin-top:12px}
/* viewer */
.vw{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
.vw.on{display:flex}
.vw .vt{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#000c}
.vw .vt b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw .x{border:0;background:#ffffff1a;border-radius:20px;width:38px;height:38px;font-size:22px;line-height:1}
.vw .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.vw img,.vw video{max-width:100%;max-height:100%;-webkit-touch-callout:default;user-select:auto}
.vw .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#0007;width:44px;height:64px;font-size:26px;color:#fff}.vw .nav.l{left:0;border-radius:0 12px 12px 0}.vw .nav.r{right:0;border-radius:12px 0 0 12px}
.vw .vb{padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:#000c}
.vw .hint{color:#cbbfb2;font-size:13px;text-align:center;margin-bottom:10px}
/* expired */
.gone{display:none;padding:80px 28px;text-align:center}.gone b{display:block;font-size:20px;margin-bottom:8px}.gone p{color:var(--mut);line-height:1.5}
body.expired .gone{display:block}body.expired .top,body.expired main{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,40px);opacity:0;background:#2a1d12;border:1px solid var(--o);border-radius:14px;padding:11px 16px;font-size:14px;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
</style></head>
<body>
<div class="gone"><div class="logo" style="margin:0 auto 18px;width:56px;height:56px"></div><b>This link has expired</b><p>Wi-Fi sharing was switched off or restarted on the computer.<br>Scan the new QR code on the After Service screen.</p></div>

<div class="top">
  <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c0d00" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M7 10h10"/></svg></div>
    <div><b>After Service</b><small><span class="dot"></span><span id="pc">Connected</span></small></div></div>
  <div class="seg"><button class="on" data-p="send">Send to computer</button><button data-p="get">Get from computer<em id="nGet" style="display:none"></em></button></div>
</div>

<main>
  <section class="pane on" id="send">
    <div class="card">
      <label class="lbl" for="who">Your name (so the media team knows who sent it)</label>
      <input type="text" id="who" placeholder="e.g. Grace" autocomplete="name" maxlength="40">
    </div>
    <label class="pick">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      <b>Choose photos &amp; videos</b><span>Pick as many as you like — they go straight to the computer</span>
      <input type="file" id="files" multiple accept="image/*,video/*">
    </label>
    <div id="sumWrap" style="display:none">
      <div class="sum"><b id="sumT"></b><span id="sumS"></span></div>
      <div class="bar"><i id="sumBar"></i></div>
    </div>
    <div class="q" id="q"></div>
    <p class="tip" id="tipSend"></p>
  </section>

  <section class="pane" id="get">
    <div class="row2" id="getActs" style="display:none"><a class="big" id="zip" href="#">Save all</a></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="getEmpty"><b>Nothing shared yet</b>When the media team shares pictures or videos from the computer, they appear here.</div>
    <p class="tip" id="tipGet"></p>
  </section>
</main>

<div class="vw" id="vw">
  <div class="vt"><b id="vName"></b><button class="x" id="vClose" aria-label="Close">×</button></div>
  <div class="stage" id="vStage"><button class="nav l" id="vPrev">‹</button><button class="nav r" id="vNext">›</button></div>
  <div class="vb"><div class="hint" id="vHint"></div><a class="big" id="vDl" href="#">Download</a></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  if (document.body.classList.contains('expired')) return;
  var K = new URLSearchParams(location.search).get('k') || '';
  var iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var human = function (n) { return n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB'; };
  var api = function (p, extra) { return p + (p.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(K) + '&sender=' + encodeURIComponent(who.value.trim()) + (extra || ''); };
  function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2800); }
  function expired() { document.body.classList.add('expired'); }

  var who = $('#who');
  try { who.value = localStorage.getItem('as-name') || ''; } catch (e) {}
  who.addEventListener('change', function () { try { localStorage.setItem('as-name', who.value.trim()); } catch (e) {} });

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('on', p.id === b.dataset.p); });
      if (b.dataset.p === 'get') refresh();
    };
  });
  $('#tipSend').innerHTML = iOS
    ? 'Keep this page open and the screen on until everything says <b>Sent</b>.<br>Tip: in the photo picker tap <b>Options → Current</b> or <b>Most Compatible</b> if you are asked. HEIC photos are turned into JPG on the computer automatically.'
    : 'Keep this page open and the screen on until everything says <b>Sent</b>. Videos can take a little while on slow Wi-Fi.';
  $('#tipGet').innerHTML = iOS
    ? '<b>Pictures:</b> tap one, then <b>touch and hold</b> it → <b>Save to Photos</b>.<br><b>Videos:</b> tap <b>Download</b>, then open it from the Downloads arrow and tap Share → <b>Save Video</b>.'
    : 'Tap a picture or video, then <b>Download</b>. Files go to your <b>Downloads</b> and show up in your Gallery.';

  /* ---------------- sending ---------------- */
  var Q = [], active = 0, MAX = 2;
  $('#files').addEventListener('change', function (e) {
    var fs = Array.prototype.slice.call(e.target.files || []);
    fs.forEach(function (f) { Q.push({ f: f, state: 'waiting', sent: 0, tries: 0, el: null }); });
    e.target.value = ''; draw(); pump();
  });
  function draw() {
    var q = $('#q');
    Q.forEach(function (it) {
      if (!it.el) {
        it.el = document.createElement('div'); it.el.className = 'qi';
        var isImg = /^image\//.test(it.f.type), ext = (it.f.name.split('.').pop() || '').toUpperCase();
        it.el.innerHTML = '<div class="th">' + (isImg ? '' : (/^video\//.test(it.f.type) ? '▶' : ext)) + '</div><div class="tx"><b>' + esc(it.f.name) + '</b><small></small><div class="bar"><i></i></div></div>';
        if (isImg) { try { var u = URL.createObjectURL(it.f), im = new Image(); im.onload = function () { it.el.querySelector('.th').style.backgroundImage = 'url(' + u + ')'; }; im.onerror = function () { it.el.querySelector('.th').textContent = ext; }; im.src = u; } catch (e) {} }
        q.insertBefore(it.el, q.firstChild);
      }
      var s = it.el.querySelector('small'), bar = it.el.querySelector('.bar i'), pct = it.f.size ? it.sent / it.f.size * 100 : 0;
      s.className = it.state === 'done' ? 'ok' : it.state === 'failed' ? 'bad' : '';
      s.textContent = it.state === 'waiting' ? 'Waiting… · ' + human(it.f.size) : it.state === 'sending' ? 'Sending ' + Math.round(pct) + '% · ' + human(it.f.size) : it.state === 'done' ? (it.dup ? '✓ Already on the computer' : '✓ Sent') : '✕ ' + (it.error || 'Failed');
      bar.style.width = (it.state === 'done' ? 100 : pct) + '%'; bar.parentNode.style.display = it.state === 'done' || it.state === 'failed' ? 'none' : '';
      var rt = it.el.querySelector('.rt');
      if (it.state === 'failed' && !rt) { rt = document.createElement('button'); rt.className = 'rt'; rt.textContent = 'Retry'; rt.onclick = function () { it.state = 'waiting'; it.tries = 0; it.sent = 0; rt.remove(); draw(); pump(); }; it.el.appendChild(rt); }
    });
    var total = Q.reduce(function (a, i) { return a + i.f.size; }, 0), sent = Q.reduce(function (a, i) { return a + (i.state === 'done' ? i.f.size : i.sent); }, 0);
    var done = Q.filter(function (i) { return i.state === 'done'; }).length, bad = Q.filter(function (i) { return i.state === 'failed'; }).length;
    $('#sumWrap').style.display = Q.length ? '' : 'none';
    $('#sumT').textContent = done === Q.length ? (Q.length + ' sent ✓') : 'Sending ' + done + ' of ' + Q.length;
    $('#sumS').textContent = human(sent) + ' / ' + human(total) + (bad ? ' · ' + bad + ' failed' : '');
    $('#sumBar').style.width = (total ? sent / total * 100 : 0) + '%';
  }
  function pump() {
    while (active < MAX) {
      var it = Q.find(function (i) { return i.state === 'waiting'; }); if (!it) break;
      active++; upload(it);
    }
  }
  function upload(it) {
    it.state = 'sending'; it.sent = 0; draw();
    var x = new XMLHttpRequest(), last = 0;
    x.open('POST', api('/api/up', '&name=' + encodeURIComponent(it.f.name || 'photo.jpg') + '&size=' + it.f.size + '&mtime=' + (it.f.lastModified || 0)));
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = function (e) { it.sent = e.loaded; if (Date.now() - last > 200) { last = Date.now(); draw(); } };
    x.onload = function () {
      active--;
      var r = {}; try { r = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 403) { expired(); return; }
      if (x.status === 200 && r.ok) { it.state = 'done'; it.dup = !!r.dup; }
      else if (x.status >= 500 && it.tries < 2) { it.tries++; it.state = 'waiting'; }
      else { it.state = 'failed'; it.error = r.error || ('Error ' + x.status); }
      draw(); pump(); if (!Q.some(function (i) { return i.state === 'waiting' || i.state === 'sending'; })) finished();
    };
    x.onerror = x.ontimeout = function () {
      active--;
      if (it.tries < 3) { it.tries++; it.state = 'waiting'; setTimeout(pump, 1500 * it.tries); }
      else { it.state = 'failed'; it.error = 'Wi-Fi connection lost — tap Retry'; }
      draw(); pump();
    };
    x.send(it.f);
  }
  function finished() { var ok = Q.filter(function (i) { return i.state === 'done'; }).length; if (ok) toast(ok + ' file' + (ok === 1 ? '' : 's') + ' sent to the computer'); }
  window.addEventListener('beforeunload', function (e) { if (Q.some(function (i) { return i.state === 'waiting' || i.state === 'sending'; })) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------------- receiving ---------------- */
  var shared = [], sig = '';
  function refresh() {
    fetch(api('/api/info'), { cache: 'no-store' }).then(function (r) { if (r.status === 403) { expired(); throw 0; } return r.json(); }).then(function (d) {
      $('#pc').textContent = 'Connected to ' + (d.workspace ? d.workspace + ' · ' : '') + d.pc;
      var s = d.shared.map(function (f) { return f.id; }).join(',');
      if (s === sig) return; sig = s; shared = d.shared;
      var n = $('#nGet'); n.textContent = shared.length; n.style.display = shared.length ? '' : 'none';
      $('#getEmpty').style.display = shared.length ? 'none' : ''; $('#getActs').style.display = shared.length > 1 ? '' : 'none';
      var tot = shared.reduce(function (a, f) { return a + f.size; }, 0);
      $('#zip').textContent = 'Save all ' + shared.length + ' as one ZIP · ' + human(tot);
      $('#zip').href = api('/api/zip'); $('#zip').setAttribute('download', '');
      if (tot > 3.9e9) $('#getActs').style.display = 'none';
      $('#grid').innerHTML = shared.map(function (f, i) {
        return '<button class="gi" data-i="' + i + '" style="background-image:url(\'' + api('/api/thumb/' + f.id) + '\')">' + (f.kind === 'video' ? '<span class="v">▶ video</span>' : '') + (f.kind === 'file' ? '<span class="fn">' + esc(f.name) + '</span>' : '') + '</button>';
      }).join('');
      document.querySelectorAll('.gi').forEach(function (b) { b.onclick = function () { view(+b.dataset.i); }; });
    }).catch(function () {});
  }
  var cur = -1;
  function view(i) {
    cur = (i + shared.length) % shared.length; var f = shared[cur], st = $('#vStage');
    st.querySelectorAll('img,video,.fn').forEach(function (x) { x.remove(); });
    var src = api('/api/file/' + f.id), el;
    if (f.kind === 'video') { el = document.createElement('video'); el.controls = true; el.playsInline = true; el.setAttribute('playsinline', ''); el.preload = 'metadata'; el.poster = api('/api/thumb/' + f.id); el.src = src; }
    else if (f.kind === 'image') { el = document.createElement('img'); el.src = src; el.alt = f.name; }
    else { el = document.createElement('div'); el.className = 'fn'; el.style.cssText = 'color:#fff;padding:30px;text-align:center'; el.textContent = f.name + ' · ' + human(f.size); }
    st.insertBefore(el, st.firstChild);
    $('#vName').textContent = f.name;
    $('#vDl').href = api('/api/file/' + f.id, '&dl=1'); $('#vDl').setAttribute('download', f.name);
    $('#vDl').textContent = 'Download · ' + human(f.size);
    $('#vHint').textContent = iOS ? (f.kind === 'image' ? 'Touch and hold the picture → Save to Photos' : f.kind === 'video' ? 'Download, then Share → Save Video' : '') : '';
    $('#vPrev').style.display = $('#vNext').style.display = shared.length > 1 ? '' : 'none';
    $('#vw').classList.add('on');
  }
  function closeV() { $('#vw').classList.remove('on'); var v = $('#vStage video'); if (v) v.pause(); }
  $('#vClose').onclick = closeV; $('#vPrev').onclick = function () { view(cur - 1); }; $('#vNext').onclick = function () { view(cur + 1); };
  var sx = 0; $('#vStage').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $('#vStage').addEventListener('touchend', function (e) { var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70 && !$('#vStage video')) view(cur + (dx < 0 ? 1 : -1)); }, { passive: true });

  refresh(); setInterval(function () { if (!document.hidden) refresh(); }, 5000);
  setInterval(function () { if (!document.hidden) fetch(api('/api/ping'), { cache: 'no-store' }).then(function (r) { if (r.status === 403) expired(); }).catch(function () {}); }, 10000);
})();
</script>
</body></html>
